jdk:
  - openjdk21

before_install:
  - chmod +x gradlew

install:
  - ./gradlew :fabric:build

  - mkdir -p build/libs
  - cp fabric/build/libs/*.jar build/libs/

build:
  artifacts:
    - path: build/libs/*.jar
      name: identity-fabric
      type: jar


script:
  - ./gradlew :fabric:publishToMavenLocal